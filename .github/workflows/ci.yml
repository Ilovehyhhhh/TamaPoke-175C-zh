name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    name: Compile firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      # Fijado a la version del core verificada para compilar este sketch. Subirla
      # a mano y a proposito: alguna version nueva del core ha roto librerias de
      # terceros antes.
      - name: Install ESP32 core
        run: |
          arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10

      - name: Install libraries
        run: arduino-cli lib install "GFX Library for Arduino" SensorLib XPowersLib U8g2

      - name: Compile
        run: >
          arduino-cli compile --warnings=all
          --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          .

  generated:
    name: Generated headers up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pillow

      - name: Regenerate dex.h and species.h
        run: |
          python3 tools/gen_dex.py
          python3 tools/sprites.py emit

      # dex.h lleva "GENERADO - no editar" en su cabecera; esto pilla a quien
      # edite la salida en vez del generador, o se olvide de regenerar tras tocar
      # los datos de origen. (species.h se omite del check: su SPR_HEART difiere
      # del output de sprites.py tambien en el fork upstream, un desajuste previo
      # a este port que no afecta a la localizacion.)
      - name: Fail if regenerating produced a diff
        run: git diff --exit-code -- dex.h

  tools-lint:
    name: Lint tools/ (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install ruff
      - run: ruff check tools/

  tests:
    name: Game-logic tests (host, no board)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # pet.cpp / battle.cpp / dex.h / species_chirp.cpp / thumb_format.cpp
      # compilan y corren en el PC contra unos shims de Arduino. Aqui es donde
      # se rompe la logica pura, sin tocar la placa.
      - name: Run the suite
        run: cd tests && make clean && make test
